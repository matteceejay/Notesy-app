name: Notesy CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'notesy' }}
  APP_NAME: ${{ vars.APP_NAME || 'notesy' }}
  JFROG_URL: ${{ vars.JFROG_URL }}          # e.g. http://100.53.110.60:8082
  JFROG_REPO: ${{ vars.JFROG_REPO }}        # e.g. devops-project
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}        # e.g. http://100.53.110.60:8200
  VAULT_JFROG_SECRET_PATH: ${{ vars.VAULT_JFROG_SECRET_PATH || 'secrets/creds/jfrog' }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------- CI (every PR + main)
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  build:
    name: Build
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: "pip install --only-binary :all: -r requirements.txt"
      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-only-not-secret
        run: python manage.py check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-js
          path: static/js
          retention-days: 3

  trivy-fs:
    name: Trivy Dependency & Config Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # flip to "1" once the backlog is clean

  test:
    name: Tests + Coverage
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notesy
          POSTGRES_USER: notesy
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notesy -d notesy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://notesy:ci-${{ github.run_id }}@localhost:5432/notesy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: "pip install --only-binary :all: -r requirements.txt pytest-cov"
      - run: pytest --cov=apps --cov=notesy --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 3

  sonar:
    name: SonarCloud Analysis
    needs: [test, trivy-fs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=**/migrations/**,**/management/**,notesy/settings.py,notesy/wsgi.py,notesy/asgi.py,notesy/urls.py,manage.py,**/static_src/**,**/tests.py,**/test_*.py
            -Dsonar.qualitygate.wait=true

  # ---------------------------------------------------------------- Container path: ECR -> ECS
  image:
    name: Build, Scan & Push Image (ECR)
    needs: sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # OIDC -> AWS
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        if: env.IS_RELEASE == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: env.IS_RELEASE == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Compute image name
        id: meta
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry || 'local' }}"
          echo "repo=$REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build image (once)
        run: docker build -t "${{ steps.meta.outputs.image }}" .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Push SHA + latest tags
        if: env.IS_RELEASE == 'true'
        run: |
          docker tag "${{ steps.meta.outputs.image }}" "${{ steps.meta.outputs.repo }}:latest"
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.repo }}:latest"

  deploy-ecs:
    name: Deploy to ECS
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Swap in the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.image.outputs.image }}

      - name: Register + deploy, wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

  # ---------------------------------------------------------------- Artifact path: JFrog -> Lightsail
  package:
    name: Package & Publish Artifact (JFrog)
    needs: sonar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.pkg.outputs.artifact }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: static-js
          path: static/js

      - name: Build release bundle
        id: pkg
        run: |
          ARTIFACT="${APP_NAME}-${GITHUB_SHA}.tar.gz"
          tar czf "$ARTIFACT" manage.py notesy apps requirements.txt static
          SHA256=$(sha256sum "$ARTIFACT" | cut -d' ' -f1)
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$ARTIFACT sha256=$SHA256"

      - name: Read JFrog creds from Vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: ${{ env.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE }}        # "Role ID" from vaultkey.txt
          secretId: ${{ secrets.VAULT_SECRET_ID }} # "Secret ID" from vaultkey.txt
          secrets: |
            ${{ env.VAULT_JFROG_SECRET_PATH }} username | JFROG_USER ;
            ${{ env.VAULT_JFROG_SECRET_PATH }} password | JFROG_PASSWORD

      - name: Upload to Artifactory
        run: |
          ARTIFACT="${{ steps.pkg.outputs.artifact }}"
          curl -fsS -u "$JFROG_USER:$JFROG_PASSWORD" \
            -H "X-Checksum-Sha256: ${{ steps.pkg.outputs.sha256 }}" \
            -T "$ARTIFACT" \
            "$JFROG_URL/artifactory/$JFROG_REPO/$APP_NAME/$GITHUB_SHA/$ARTIFACT"
          echo

  deploy-lightsail:
    name: Deploy to Lightsail
    needs: package
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.LIGHTSAIL_HOST }}
      ARTIFACT: ${{ needs.package.outputs.artifact }}
      EXPECTED_SHA256: ${{needs.package.outputs.sha256}}
    steps:
      - name: Read JFrog creds from Vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: ${{ env.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            ${{ env.VAULT_JFROG_SECRET_PATH }} username | JFROG_USER ;
            ${{ env.VAULT_JFROG_SECRET_PATH }} password | JFROG_PASSWORD

      - name: Pull the exact artifact back from JFrog and verify it
        run: |
          curl -fsS -u "$JFROG_USER:$JFROG_PASSWORD" -o "$ARTIFACT" \
            "$JFROG_URL/artifactory/$JFROG_REPO/$APP_NAME/$GITHUB_SHA/$ARTIFACT"
          echo "$EXPECTED_SHA256  $ARTIFACT" | sha256sum -c -

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Copy + activate release
        run: |
          scp -i ~/.ssh/deploy_key "$ARTIFACT" "ubuntu@$HOST:/tmp/"
          ssh -i ~/.ssh/deploy_key "ubuntu@$HOST" \
            "SHA=$GITHUB_SHA ARTIFACT=$ARTIFACT HOST=$HOST bash -s" <<'REMOTE'
          set -euo pipefail
          REL=/opt/notesy/releases/$SHA
          sudo mkdir -p "$REL"
          sudo tar xzf "/tmp/$ARTIFACT" -C "$REL"
          sudo python3 -m venv "$REL/.venv"
          sudo "$REL/.venv/bin/pip" install -q -r "$REL/requirements.txt"
          sudo chown -R notesy:notesy "$REL"
          sudo sed -i "s/^DJANGO_ALLOWED_HOSTS=.*/DJANGO_ALLOWED_HOSTS=$HOST,localhost,127.0.0.1/" /etc/notesy/notesy.env
          sudo -u notesy bash -c "cd '$REL' && set -a && . /etc/notesy/notesy.env && set +a && \
            .venv/bin/python manage.py migrate --noinput && \
            .venv/bin/python manage.py collectstatic --noinput"
          sudo ln -sfn "$REL" /opt/notesy/current
          sudo systemctl restart notesy
          # keep the 5 newest releases for quick rollback
          sudo bash -c 'ls -1dt /opt/notesy/releases/* | tail -n +6 | xargs -r rm -rf'
          rm -f "/tmp/$ARTIFACT"
          REMOTE

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null "http://$HOST:8000/login/" && echo "up" && exit 0
            sleep 3
          done
          echo "Lightsail app did not come up"; exit 1
